name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu-22.04
          - ubuntu-24.04
          - fedora
          - rocky
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up test environment
        run: |
          cd tests/docker/${{ matrix.distro }}
          docker build -t ip-allowlist-test:${{ matrix.distro }} .

      - name: Run tests
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ip-allowlist-test:${{ matrix.distro }} \
            /src/tests/run.sh --local

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lint
        run: ./tests/lint.sh

      - name: Check example config keys against docs
        run: ./tests/doc-keys.sh
