name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION="$(cat version.txt)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release archive and checksum
        run: |
          mkdir -p dist
          NAME="ip-allowlist-v${{ steps.version.outputs.version }}"
          tar -czf "dist/${NAME}.tar.gz" \
            --transform "s|^|${NAME}/|" \
            ip-allowlist lib install.sh uninstall.sh config systemd version.txt \
            README.md LICENSE CHANGELOG.md
          ( cd dist && sha256sum "${NAME}.tar.gz" > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            dist/ip-allowlist-v${{ steps.version.outputs.version }}.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
